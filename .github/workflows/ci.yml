name: ops-requisition-auditor CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run full unit & integration test suite (Candidate + Modules 1-3)
        run: python -B -m unittest discover -s tests -v
      - name: Verify demo.html and docs/index.html byte parity
        run: cmp -s demo.html docs/index.html
      - name: Run deterministic Candidate JD Alignment engine demo & fixtures
        run: |
          python -B scripts/offline_ats_auditor.py --demo
          python -B scripts/offline_ats_auditor.py --resume examples/sample_resume.txt --jd-config examples/sample_ats_config.json
          python -B scripts/offline_ats_auditor.py --resume examples/sample_resume_optimized.txt --jd-config examples/sample_ats_config.json
      - name: Run job posting collector CLI demo
        run: python -B scripts/job_posting_collector.py --demo
      - name: Run Employer Module 1 (Requisition Quality Audit + CSV export)
        run: |
          python -B scripts/requisition_quality_auditor.py --jd-file examples/sample_requisition_unicorn.txt --csv-out /tmp/rqs_unicorn.csv
          python -B scripts/requisition_quality_auditor.py --jd-file examples/sample_requisition_improved.txt --csv-out /tmp/rqs_improved.csv
      - name: Run Employer Module 2 (Explainable Screening Assistant + CSV export)
        run: |
          python -B scripts/explainable_screening_assistant.py --demo --csv-out /tmp/screening_shortlist.csv
      - name: Run Employer Module 3 (Internal Mobility & Outplacement Matcher + CSV export)
        run: |
          python -B scripts/internal_mobility_matcher.py --demo --csv-out /tmp/mobility_ladder.csv
          python -B scripts/internal_mobility_matcher.py --resume examples/sample_resume.txt --from-json examples/sample_mobility_career_ladder.json --outplacement-pack

name: Enterprise ATS Auditor CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit & integration test suite
        run: python -m unittest discover -s tests -v
      - name: Run deterministic ATS auditor CLI demo
        run: python scripts/offline_ats_auditor.py --demo
      - name: Verify baseline & optimized sample fixtures via CLI
        run: |
          python scripts/offline_ats_auditor.py --resume examples/sample_resume.txt --jd-config examples/sample_ats_config.json
          python scripts/offline_ats_auditor.py --resume examples/sample_resume_optimized.txt --jd-config examples/sample_ats_config.json
      - name: Run job posting collector CLI demo
        run: python scripts/job_posting_collector.py --demo

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-requisition-auditor"
version = "1.6.0"
description = "ops-requisition-auditor: deterministic, explainable JD Alignment scoring with quoted evidence and zero-fabrication rewrites for operations, WFM, and BI requisitions"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md", "NOTICE"]
authors = [{ name = "Alexandru Manning" }]
keywords = ["requisition", "jd-alignment", "resume", "explainable-ai", "workforce-management", "recruiting", "skills-based-hiring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AManning30/ops-requisition-auditor"
Repository = "https://github.com/AManning30/ops-requisition-auditor"
"Interactive Workbench" = "https://amanning30.github.io/ops-requisition-auditor/"
Releases = "https://github.com/AManning30/ops-requisition-auditor/releases"
Issues = "https://github.com/AManning30/ops-requisition-auditor/issues"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["offline_ats_auditor", "job_posting_collector", "tos_compliant_collector", "requisition_quality_auditor", "explainable_screening_assistant", "internal_mobility_matcher", "pilot_evidence_harness", "governance_middleware", "compliance_policy_registry", "privacy_data_minimization", "fairness_adverse_impact_auditor", "parser_benchmark_suite", "org_customization_registry", "integration_adapters_and_webhooks", "workbench_parity_and_a11y", "public_trust_and_benchmarks", "hybrid_auth"]

[project.scripts]
ops-req-audit = "offline_ats_auditor:main"
ops-req-collect = "job_posting_collector:main"
ops-req-api-collect = "tos_compliant_collector:main"
ops-req-jd-audit = "requisition_quality_auditor:main"
ops-req-screen = "explainable_screening_assistant:main"
ops-req-mobility = "internal_mobility_matcher:main"
ops-req-pilot = "pilot_evidence_harness:main"
ops-req-governance = "governance_middleware:main"
ops-req-policy = "compliance_policy_registry:main"
ops-req-privacy = "privacy_data_minimization:main"
ops-req-fairness = "fairness_adverse_impact_auditor:main"
ops-req-parser-bench = "parser_benchmark_suite:main"
ops-req-org-config = "org_customization_registry:main"
ops-req-integrate = "integration_adapters_and_webhooks:main"
ops-req-workbench = "workbench_parity_and_a11y:main"
ops-req-trust-bench = "public_trust_and_benchmarks:main"

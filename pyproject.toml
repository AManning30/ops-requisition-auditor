[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ats-auditor"
version = "1.2.0"
description = "Deterministic 100-Point Enterprise ATS Mathematical Auditor, Multi-Board Job Posting Collector, and Interactive Score Simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandru Manning" }]
keywords = ["ats", "resume-parser", "hr-xml", "job-search", "workforce-management", "recruiting"]
dependencies = []

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["offline_ats_auditor", "job_posting_collector"]

[project.scripts]
ats-auditor = "offline_ats_auditor:main"
job-collector = "job_posting_collector:main"
